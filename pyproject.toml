[project]
name = "hunterHearsPy"
version = "1.4.1"
description = "Audio processing."
readme = "README.md"
requires-python = ">=3.12"
license = "CC-BY-NC-4.0"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "Hunter Hogan", email = "HunterHogan@pm.me" }]
maintainers = [{ name = "Hunter Hogan", email = "HunterHogan@pm.me" }]
keywords = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  "Z0Z_tools>=4.0.0",
  "hunterMakesPy>=0.10.0",
  "numpy",
  "resampy",
  "scipy",
  "soundfile>=0.14.0",
  "tqdm",
  "typing-extensions>=4.0.0",
]
optional-dependencies = { development = ["astToolkit", "pytest-cov", "scipy-stubs", "types-resampy"], testing = ["pytest", "pytest-mock", "pytest-xdist", "torch"], torch = ["torch"] }

[project.urls]
Context7 = "https://context7.com/hunterhogan/hunterhearspy"
Donate = "https://www.patreon.com/integrated"
Download = "https://pypi.org/project/hunterHearsPy"
Homepage = "https://github.com/hunterhogan/hunterHearsPy"
Issues = "https://github.com/hunterhogan/hunterHearsPy/issues"
Repository = "https://github.com/hunterhogan/hunterHearsPy.git"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.coverage]
report = { exclude_lines = ["if TYPE_CHECKING:", "if __name__ == \"__main__\":"], ignore_errors = false }
run = { branch = true, concurrency = ["multiprocessing"], data_file = "tests/coverage/.coverage", omit = ["tests/*"], parallel = true, source = ["."] }

[tool.pytest]
addopts = ["--color=auto", "--tb=line", "-n", "4"]
log_auto_indent = "On"
testpaths = ["tests"]

[tool.setuptools]
package-data = { "*" = ["py.typed"]}
packages = { find = {} }

[tool.updateCitation]
filenameCitationDOTcff = "CITATION.cff"
pathFilenameCitationSSOT = "citations/CITATION.cff"
